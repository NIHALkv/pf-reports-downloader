# Builds SkillPrism_Report_Downloader.exe on Windows, self-tests it, and publishes it
# to the "latest" release. Runs on every push to main.
name: Build Prismforce Report Downloaders

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt pyinstaller

      - name: Fetch brand font (Plus Jakarta Sans, OFL)
        shell: pwsh
        continue-on-error: true
        run: Invoke-WebRequest "https://github.com/google/fonts/raw/main/ofl/plusjakartasans/PlusJakartaSans%5Bwght%5D.ttf" -OutFile branding/PlusJakartaSans.ttf

      - name: Build both apps (windowed, PF branding)
        shell: pwsh
        run: |
          foreach ($app in @(@{name="SkillPrism_Report_Downloader"; entry="app_skillprism.py"}, @{name="IntelliPrism_Report_Downloader"; entry="app_intelliprism.py"})) {
            pyinstaller --onefile --windowed --name $app.name --icon branding/pf-icon.ico --add-data "branding;branding" --collect-all playwright --hidden-import rms_automation --hidden-import automation $app.entry
            if ($LASTEXITCODE -ne 0) { throw "Build failed for $($app.name)" }
          }

      - name: Self-test both apps (window opens, engine + browser driver load)
        shell: pwsh
        run: |
          $env:PF_SELFTEST = "1"
          $data = "$env:APPDATA\PF Reports Downloader"
          foreach ($t in @(@{exe="SkillPrism_Report_Downloader"; product="skillprism"; reports=14}, @{exe="IntelliPrism_Report_Downloader"; product="intelliprism"; reports=5})) {
            $p = Start-Process "dist\$($t.exe).exe" -PassThru -Wait
            if (Test-Path "$data\error_log.txt") { Get-Content "$data\error_log.txt"; throw "$($t.exe) crashed on start" }
            $f = "$data\selftest_$($t.product).txt"
            if (-not (Test-Path $f)) { throw "$($t.exe) self-test did not run (exit $($p.ExitCode))" }
            Get-Content $f
            if (-not (Select-String -Path $f -Pattern "driver_exists=True" -Quiet)) { throw "$($t.exe): browser driver missing" }
            if (-not (Select-String -Path $f -Pattern "reports=$($t.reports)" -Quiet)) { throw "$($t.exe): report list incomplete" }
            if (-not (Select-String -Path $f -Pattern "schedule=ok" -Quiet)) { throw "$($t.exe): Windows Task Scheduler test failed" }
            # background (scheduled) mode starts and exits cleanly for an unknown schedule id
            $env:PF_SELFTEST = ""
            $q = Start-Process "dist\$($t.exe).exe" -ArgumentList "--scheduled","nosuchid" -PassThru -Wait
            if ($q.ExitCode -ne 1) { throw "$($t.exe): --scheduled mode returned $($q.ExitCode), expected 1" }
            $env:PF_SELFTEST = "1"
          }
          Get-Content "$data\run_logs\scheduled_*.log" -ErrorAction SilentlyContinue
          Write-Host "Both self-tests passed (UI, engine, browser driver, Windows Task Scheduler, scheduled mode)."

      - name: Move the release tag to this commit
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Prismforce Report Downloaders (latest)
          body: |
            - **SkillPrism_Report_Downloader.exe**: SkillPrism Reports Center (14 reports)
            - **IntelliPrism_Report_Downloader.exe**: IntelliPrism reports (5 reports, 1 Jan 2016 to today)

            Download, double-click, sign in once, pick client + admin user + reports, click **Download reports**.
            Both built and self-tested automatically on Windows.
          files: |
            dist/SkillPrism_Report_Downloader.exe
            dist/IntelliPrism_Report_Downloader.exe
          make_latest: true
